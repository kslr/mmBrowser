name: CI

# main 上的推送由 release.yml 调用这里先跑测试
on:
  pull_request:
  workflow_call:

jobs:
  test:
    # 需要 Xcode 26（Swift 6.2）；更早的 Xcode 自带的 Swift 编不过本项目
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: 编译并测试
        run: xcodebuild test -project mmBrowser.xcodeproj -scheme mmBrowser -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData"
      # 用上一步构建时 Xcode 抽取的 key 核对 String Catalog（漏加的 key、没翻译的条目、占位符不一致）
      - name: 本地化检查
        run: python3 scripts/check-l10n.py --derived-data "$RUNNER_TEMP/DerivedData"
