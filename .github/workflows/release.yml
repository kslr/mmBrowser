name: Release

# 每次推送到 main 自动发布（只打 Apple Silicon 包）。版本号取北京时间当天日期（如 2026.11.9），同一天再发就是 2026.11.9.2、2026.11.9.3……
on:
  push:
    branches: [main]

# 新推送会取消上一次还没发完的发布，只发最新的提交；同时也避免两次推送算出同一个版本号
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: macos-26  # arm64
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号
        id: version
        run: |
          export TZ=Asia/Shanghai
          base="$(date +%Y).$((10#$(date +%m))).$((10#$(date +%d)))"
          version=$base n=1
          while git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; do
            n=$((n + 1)); version="$base.$n"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 打包
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild build -project mmBrowser.xcodeproj -scheme mmBrowser -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION"
          ditto -c -k --keepParent "$RUNNER_TEMP/DerivedData/Build/Products/Release/mmBrowser.app" \
            "$RUNNER_TEMP/mmBrowser-$VERSION-arm64.zip"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "$RUNNER_TEMP/mmBrowser-$VERSION-arm64.zip" \
            --target "$GITHUB_SHA" --title "mmBrowser $VERSION" --generate-notes
